version: 57
properties:
- name: image
  value: gradle:9-jdk21
  archived: false
imports:
- projectPath: common/java/gradle-fatjar
  revision: main
  accessTokenSecret: common-import
jobs:
- name: Push to Github
  executeInSandbox: false
  steps:
  - type: PushRepository
    name: Github
    remoteUrl: https://github.com/Danish-Sensor-Engineering/dse-demo-serial-java
    userName: mnellemann
    passwordSecret: GITHUB-TOKEN
    force: false
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
    projects: dse/dse-demo-serial-java
  jobDependencies:
  - jobName: Test
    requireSuccessful: true
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
